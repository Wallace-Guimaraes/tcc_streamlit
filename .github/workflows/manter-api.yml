name: Verificar disponibilidade da API

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manter-api.yml'

permissions: {}

concurrency:
  group: verificar-api
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SAUDE_URL: ${{ vars.API_HEALTH_URL || 'https://tcc-streamlit.onrender.com/saude' }}
    steps:
      - name: Consultar a API e conferir o banco
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --retry-delay 10 --connect-timeout 15 --max-time 60 \
            "$SAUDE_URL" --output "$RUNNER_TEMP/saude.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          resposta = json.loads((Path(os.environ['RUNNER_TEMP']) / 'saude.json').read_text())
          if resposta.get('status') != 'ok':
              raise SystemExit('A API não confirmou a conexão com o banco.')
          print('API e conexão com o banco disponíveis.')
          PY
